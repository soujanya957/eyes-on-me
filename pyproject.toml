[project]
name = "eyes-on-me"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "bosdyn-api>=5.2.0",
    "bosdyn-client>=5.2.0",
    "numpy>=1.26",
    "opencv-python>=4.9",
    "python-dotenv>=1.0",
]

[project.scripts]
eyes-on-me = "eyes_on_me.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eyes_on_me"]
